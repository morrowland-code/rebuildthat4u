<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products for Sale - RebuildThat4U</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: orange;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #fff;
      font-size: 2em;
    }
    .product-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .product-card {
      background: #fff3e0;
      border: 2px solid #ffa500;
      border-radius: 10px;
      padding: 15px;
      width: 200px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }
    .product-name {
      font-weight: bold;
      margin-top: 10px;
      color: #d35400;
    }
    .price {
      margin: 5px 0;
      color: #333;
    }
    .buy-btn {
      background: #ff6600;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 10px;
    }
    .buy-btn:hover {
      background: #e65c00;
    }
  </style>
</head>
<body>
  <h1>Welcome to RebuildThat4U!</h1>
  <div class="product-list" id="productList"></div>
  <a href="cart.html" class="buy-btn">Go to Cart</a>

  <script>
    async function loadProducts() {
      const res = await fetch('/get-products');
      const products = await res.json();
      const container = document.getElementById('productList');

      const cart = JSON.parse(localStorage.getItem('cart') || '[]');

      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';

        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}">
          <div class="product-name">${product.name}</div>
          <div class="price">$${product.price.toFixed(2)}</div>
          <button class="buy-btn">BUY NOW</button>
        `;

        card.querySelector('button').onclick = () => {
          cart.push(product);
          localStorage.setItem('cart', JSON.stringify(cart));
          alert("Added to cart!");
        };

        container.appendChild(card);
      });
    }

    loadProducts();
  </script>
</body>
</html>
