<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RebuildThat4U Login</title>
  <style>
    body {
      background-color: orange;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: white;
    }
    input {
      padding: 10px;
      margin: 10px;
      width: 250px;
      font-size: 16px;
    }
    button {
      background-color: #333;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #555;
    }
    #message {
      margin-top: 20px;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Login to RebuildThat4U</h1>
  <input type="text" id="username" placeholder="Username"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>
  <div id="message"></div>  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const result = await res.json();

      if (result.success) {
        if (username === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'checkout.html';
        }
      } else {
        document.getElementById('message').innerText = 'Login failed';
      }
    }

    async function register() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const result = await res.json();

      if (result.success) {
        document.getElementById('message').innerText = 'Registered successfully, now login.';
      } else {
        document.getElementById('message').innerText = 'Username already exists.';
      }
    }
  </script></body>
</html>
